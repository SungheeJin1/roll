<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원숭이 인형의 겨울</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
/* 한 화면 게임: 영상 속 게임 화면(1114×1113)과 같은 비율로 가운데에 맞춤 */
:root{
  --bg:#06070c;
  --frame:#c6c4cc;
  --ink:#f4f1f7;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#wrap{
  position:relative;
  width:min(100%, calc((100dvh - 24px) * 1114 / 1113));
  max-width:100%;
  aspect-ratio:1114/1113;
  border:3px solid var(--frame);
  box-sizing:border-box;
  background:#000;
}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px #f2c14e}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="원숭이 인형의 겨울 게임 화면"></canvas></div>
<script>
'use strict';
/* =========================================================
   원숭이 인형의 겨울 — 눈 오는 밤 / 아침 / 바깥 산책
   그림: 영상 프레임에서 직접 가져온 배경·캐릭터 (assets/)
   좌표: 영상 프레임(1180×1150) 기준, 화면에는 실제 게임 영역(33,24)~(1147,1137)만 보임
   ========================================================= */
const W = 1180, H = 1150, OX = 33, OY0 = 24, CW = 1114, CH = 1113;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = CW; cv.height = CH;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const UI_S = 4, TX_S = 2;
const uiC = mk(Math.ceil(W / UI_S), Math.ceil(H / UI_S)), u = uiC.getContext('2d');
const txC = mk(W / TX_S, Math.ceil(H / TX_S)), t2 = txC.getContext('2d');
const dynA = mk(W, H), dA = dynA.getContext('2d');
const dynB = mk(W, H), dB = dynB.getContext('2d');
const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const HX = new Map();
function hex(h) { let v = HX.get(h); if (!v) { const s = h.slice(1); v = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; HX.set(h, v); } return v; }
function mixc(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, Math.PI * 2); }
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
let seed = 11;
function srand(s) { seed = s; }
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

/* =========================================================
   그림 파일 (영상에서 오려 낸 배경·캐릭터 + 같은 느낌으로 렌더링한 바깥 풍경)
   META: [너비, 높이, 기준점x, 기준점y]  — 기준점은 보통 발 밑
   ========================================================= */
const META = {"bed_fg":[426,316,4,-627],"teddy":[170,170,81,159],"mk_front_cry":[421,390,202,396],"mk_front_neutral":[421,390,202,396],"mk_front_happy":[421,390,202,396],"mk_front_sleep":[421,390,202,396],"mk_side":[359,395,144,391],"mk_back":[393,422,217,417],"mk_front_cry_day":[421,390,202,396],"mk_front_neutral_day":[421,390,202,396],"mk_front_happy_day":[421,390,202,396],"mk_front_sleep_day":[421,390,202,396],"mk_side_day":[359,395,144,391],"mk_back_day":[393,422,217,417],"teddy_day":[170,170,81,159],"p_rug":[349,91,174,45],"bed_fg_day":[426,316,4,-627]};
const FILES = ['room_night.jpg', 'room_day.jpg', 'closet_closed.jpg', 'closet_dark.jpg', 'closet_lit.jpg', 'closet_sleep.jpg', 'closet_morning.jpg',]
  .concat(Object.keys(META).map(k => k + '.webp'));
const IMG = {};
let loaded = 0, ready = false;
function loadAll() {
  return Promise.all(FILES.map(f => new Promise(res => {
    const im = new Image(); const key = f.replace(/\.(jpg|webp|png)$/, '');
    im.onload = () => { loaded++; res(); }; im.onerror = () => { loaded++; console.warn('그림을 못 불러옴:', f); res(); };
    im.src = 'assets/' + f; IMG[key] = im;
  })));
}
function spr(g, n, x, y, s, flip) {
  const m = META[n], im = IMG[n]; if (!m || !im || !im.naturalWidth) return;
  s = s || 1;
  if (flip) { g.save(); g.translate(x, y); g.scale(-1, 1); g.drawImage(im, -m[2] * s, -m[3] * s, m[0] * s, m[1] * s); g.restore(); }
  else g.drawImage(im, x - m[2] * s, y - m[3] * s, m[0] * s, m[1] * s);
}
function plate(g, n, a) { const im = IMG[n]; if (!im || !im.naturalWidth) return; if (a !== undefined) g.globalAlpha = a; g.drawImage(im, OX, OY0); g.globalAlpha = 1; }

/* ---------- 캐릭터 ---------- */
// 목도리를 두를 위치 (발 기준, 원본 크기)
const NECK = { front: [0, -128, 1], side: [-14, -118, .78], back: [0, -138, 1.05] };
function drawShadow(g, x, y, rx, ry, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, rx);
  gr.addColorStop(0, `rgba(6,8,20,${a})`); gr.addColorStop(.6, `rgba(6,8,20,${a * .55})`); gr.addColorStop(1, 'rgba(6,8,20,0)');
  g.save(); g.translate(x, y); g.scale(1, ry / rx); g.translate(-x, -y); g.fillStyle = gr; g.fillRect(x - rx, y - rx, rx * 2, rx * 2); g.restore();
}
/* o: {view:'front'|'side'|'back', flip, expr, day, moving, walk, t, shiver, scarf, held, sit} */
function drawMk(g, x, y, s, o) {
  drawShadow(g, x, y - 2 * s, 130 * s, 26 * s, .5);
  const t = o.t || 0;
  const bob = o.moving ? -Math.abs(Math.sin(o.walk)) * 16 * s : 0;
  const rot = o.moving ? Math.sin(o.walk) * .055 : Math.sin(t * 1.3) * .012;
  const breath = o.moving ? 1 : 1 + Math.sin(t * 2.4) * .012;
  const sq = o.sit ? .93 : 1;
  const sh = o.shiver ? Math.sin(t * 55) * 2.5 * s : 0;
  const view = o.view || 'front';
  const name = (view === 'front' ? 'mk_front_' + (o.expr || 'neutral') : view === 'side' ? 'mk_side' : 'mk_back') + (o.day ? '_day' : '');
  g.save(); g.translate(x + sh, y + bob); g.rotate(rot); g.scale(1, breath * sq);
  const flip = view === 'side' && o.flip;
  if (o.held && view === 'back') o.held(g, 0, -250 * s, s, flip);
  spr(g, name, 0, 0, s, flip);
  if (o.scarf) { const n = NECK[view]; g.save(); g.translate((flip ? -n[0] : n[0]) * s, (n[1] + 105) * s); g.scale(n[2] * s * (flip ? -1 : 1), s); drawScarfOn(g, 0); g.restore(); }
  if (o.held && view !== 'back') o.held(g, view === 'side' ? (flip ? 110 : -110) * s : 0, (view === 'side' ? -95 : -70) * s, s, flip);
  g.restore();
}

function drawFolded(g, x, y, w, h, col, sh) {
  const gr = g.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, col); gr.addColorStop(1, sh);
  rr(g, x - w / 2, y - h, w, h, h * .48); g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.13)'; g.lineWidth = 2.5; g.beginPath();
  g.moveTo(x - w / 2 + h * .4, y - h * .5); g.quadraticCurveTo(x, y - h * .38, x + w / 2 - h * .4, y - h * .52); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(x - w / 2 + h * .5, y - h + 5); g.lineTo(x + w / 2 - h * .5, y - h + 5); g.stroke();
}
function drawPillow(g, x, y, w, h, col, sh) {
  const l = x - w / 2, r = x + w / 2, tp = y - h;
  const gr = g.createLinearGradient(0, tp, 0, y); gr.addColorStop(0, col); gr.addColorStop(1, sh);
  g.beginPath(); g.moveTo(l, tp + 4); g.quadraticCurveTo(x, tp - 12, r, tp + 4); g.quadraticCurveTo(r - 13, y - h / 2, r, y - 2);
  g.quadraticCurveTo(x, y + 9, l, y - 2); g.quadraticCurveTo(l + 13, y - h / 2, l, tp + 4); g.closePath();
  g.fillStyle = gr; g.fill(); g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 2; g.stroke();
}
function drawScarfItem(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const strip = (dx, len, rot) => {
    g.save(); g.translate(dx, 0); g.rotate(rot);
    g.fillStyle = '#d8434b'; rr(g, -15, 0, 30, len, 12); g.fill();
    g.fillStyle = '#f6efe8'; for (let i = 22; i < len - 18; i += 30) g.fillRect(-15, i, 30, 8);
    g.strokeStyle = '#f6efe8'; g.lineWidth = 3; g.beginPath(); for (let i = -12; i <= 12; i += 6) { g.moveTo(i, len - 2); g.lineTo(i, len + 12); } g.stroke();
    g.restore();
  };
  strip(-16, 120, .12); strip(16, 96, -.1);
  g.fillStyle = '#c23a42'; rr(g, -34, -10, 68, 20, 10); g.fill();
  g.restore();
}
function drawSnowball(g, x, y, r) {
  const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#bccbe2');
  g.fillStyle = gr; ell(g, x, y, r, r); g.fill();
}
function drawAcorn(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#b8783a'; ell(g, 0, 6, 16, 19); g.fill();
  g.fillStyle = '#7a4c22'; rr(g, -19, -16, 38, 18, 9); g.fill();
  g.strokeStyle = '#5a3818'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, -16); g.lineTo(3, -25); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.35)'; ell(g, -6, 6, 4, 7); g.fill();
  g.restore();
}
function drawChick(g, x, y, s, t, happy) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,.25)'; ell(g, 0, 0, 26, 6); g.fill();
  const gr = g.createRadialGradient(-8, -34, 3, 0, -26, 30); gr.addColorStop(0, '#fff7d6'); gr.addColorStop(1, '#f2c84b');
  g.fillStyle = gr; ell(g, 0, -26, 27, 25); g.fill();
  const fl = happy ? Math.sin(t * 18) * .5 : 0;
  g.fillStyle = '#e9b53a'; ell(g, -24, -24, 9, 14, .5 + fl); g.fill(); ell(g, 24, -24, 9, 14, -.5 - fl); g.fill();
  g.fillStyle = '#e8862f'; g.beginPath(); g.moveTo(-6, -24); g.lineTo(6, -24); g.lineTo(0, -15); g.closePath(); g.fill();
  g.fillStyle = '#2a2026'; if (happy) { g.strokeStyle = '#2a2026'; g.lineWidth = 2.5; g.beginPath(); g.arc(-10, -30, 4, Math.PI * 1.1, Math.PI * 1.9); g.moveTo(14, -30); g.arc(10, -30, 4, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  else { ell(g, -10, -31, 3, 3.5); g.fill(); ell(g, 10, -31, 3, 3.5); g.fill(); }
  g.fillStyle = '#f2c84b'; g.beginPath(); g.moveTo(-3, -50); g.quadraticCurveTo(2, -60, 6, -50); g.fill();
  g.strokeStyle = '#e8862f'; g.lineWidth = 3; g.beginPath(); g.moveTo(-7, -2); g.lineTo(-7, 2); g.moveTo(7, -2); g.lineTo(7, 2); g.stroke();
  g.restore();
}

function drawScarfOn(g, fx) {
  g.save(); g.translate(fx * 18, 0);
  rr(g, -70, -122, 140, 34, 16); g.fillStyle = '#d8434b'; g.fill();
  g.fillStyle = '#f6efe8'; for (let i = -54; i < 60; i += 28) g.fillRect(i, -122, 9, 34);
  rr(g, 22, -102, 30, 70, 10); g.fillStyle = '#c93a43'; g.fill();
  g.fillStyle = '#f6efe8'; g.fillRect(22, -60, 30, 8);
  g.restore();
}
/* 이불 더미 (예전 디자인의 접힌 이불과 베개를 쌓음), k: 밤 어둡기 */
function nightc(c, k) { return k > 0 ? mixc(c, '#1c2442', k) : c; }
function drawStackP(g, x, y, s, k) {
  g.save(); g.translate(x, y); g.scale(s, s);
  drawFolded(g, 0, 0, 236, 40, nightc('#e3e9f3', k), nightc('#a3aec4', k));
  drawFolded(g, 0, -36, 228, 38, nightc('#f0e4be', k), nightc('#bba97c', k));
  drawPillow(g, 0, -72, 180, 40, nightc('#edc8d6', k), nightc('#b88c9d', k));
  drawPillow(g, 4, -106, 150, 36, nightc('#f2dd9e', k), nightc('#c2a662', k));
  g.restore();
}
const OY = z => 790 + z * 2.7, OS = z => .66 + z * .0042;
/* =========================================================
   상태
   ========================================================= */
const G = { muted: true, menu: false, time: 0 };
const K = { up: 0, down: 0, left: 0, right: 0 };
const PAD = { up: 0, down: 0, left: 0, right: 0, act: 0 };
// 방 바닥 원근 (영상 속 원숭이: 발 y≈965에서 키 390)
const RY = z => 735 + z * 3.3, RS = z => .62 + z * .0054, RX = (x, z) => 590 + (x - 50) * 11 * RS(z);
// 바깥: 길 위 깊이
const OYZ = z => 790 + z * 2.7, OSC = z => .6 + z * .0026, PS = z => .75 + z * .003, WW = 3000;
const STACK_HOME = { x: 68, z: 66 };

function resetCommon() {
  Object.assign(G, { carry: null, bubble: null, target: null, pend: null, exprOv: null, sleep: false, sitFire: false, idle: 0, stepT: 0, near: null, acts: [], img: null, img2: null, fadeT: 1 });
  G.p = { x: 34, z: 76, face: -1, view: 'front', walk: 0, moving: false, dir: { x: -1, z: 0 } };
}
function newGame() { Object.assign(G, { day: 1, hp: 100, warm: 29, scarf: false }); startNight(true); }
function startNight(first) {
  resetCommon();
  Object.assign(G, { scene: 'room', phase: 'night', tod: 0, todTarget: 0, scarf: false });
  G.loc = { stack: 'floor', teddy: 'seat', scarf: 'ward' };
  G.stackPos = { ...STACK_HOME };
  G.warm = Math.min(G.warm, 29); G.hp = Math.max(G.hp, 80);
  setStep('n_carry');
  say(first ? ['눈 오는 밤 너무 추워,', '방 안이 너무 추워'] : ['벌써 밤이 됐어…', '또 눈이 내려, 추워'], 'cry', 5.5);
}
function startClosetNight() {
  resetCommon(); Object.assign(G, { scene: 'closet', phase: 'closetNight' });
  showImg('closet_closed', 0); setStep('c_enter');
}
function startMorning() {
  resetCommon(); Object.assign(G, { scene: 'closet', phase: 'closetMorning', tod: 1, todTarget: 1 });
  showImg('closet_morning', 0);
  G.warm = Math.max(G.warm, 80); G.hp = 100; G.day++;
  setStep('c_wake'); say(['잘 잤다~', '좋은 아침이야!'], 'happy', 4);
}
function startDay(fromMenu) {
  resetCommon(); Object.assign(G, { scene: 'room', phase: 'day', tod: 1, todTarget: 1 });
  if (fromMenu || !G.loc) G.scarf = false;
  G.loc = { stack: 'ward', teddy: 'ward', scarf: G.scarf ? 'worn' : 'ward' };
  G.stackPos = { ...STACK_HOME };
  G.p.x = 40; G.p.z = 8; G.warm = Math.max(G.warm, 70);
  setStep('d_stack'); say(['와! 눈이 그쳤어.', '햇살이 반짝반짝해!'], 'happy', 5);
}
function returnHomeDay() {
  resetCommon(); Object.assign(G, { scene: 'room', phase: 'day', tod: 1, todTarget: 1 });
  G.loc = { stack: 'floor', teddy: 'seat', scarf: 'worn' }; G.stackPos = { ...STACK_HOME };
  G.p.x = 50; G.p.z = 88; G.warm = Math.max(G.warm, 60);
  setStep('d_free'); say(['집이 최고야.', '조금 쉬었다 또 나가자'], 'happy', 4);
}
function startOut(night) {
  resetCommon();
  Object.assign(G, { scene: 'out', phase: 'out', outNight: !!night, tod: night ? 0 : 1, todTarget: night ? 0 : 1, snowman: 0, acorn: 'tree', bird: 'post', foot: [], stepAcc: 0 });
  G.piles = [{ x: 860, z: 30, taken: false }, { x: 1270, z: 72, taken: false }, { x: 1500, z: 16, taken: false }];
  G.chick = { x: 2110, z: 4, hop: 0 };
  G.p.x = 335; G.p.z = 22; G.p.face = 1;
  setStep('o_snow');
  say(night ? ['밤 공기가 차가워…', '그래도 눈이 예뻐'] : ['공기가 차갑지만', '정말 상쾌해!'], night ? 'neutral' : 'happy', 5);
}
function showImg(n, fade) { G.img2 = G.img; G.img = n; G.fadeT = fade ? 0 : 1; G.fadeDur = fade || 1; }

const STEPS = {
  n_carry: { b: '추워요! 옷장에서 몸 녹이기', s: '이불을 전부 옷장에 옮겨서 몸을 녹이자!' },
  n_teddy: { b: '인형과 함께 눈보라 피하기', s: '곰인형도 옷장에 데려가자' },
  n_enter: { b: '인형과 함께 눈보라 피하기', s: '옷장 안으로 쏙 들어가자' },
  c_enter: { b: '인형과 함께 눈보라 피하기', s: '' },
  c_lamp: { b: '인형과 함께 눈보라 피하기', s: '작은 등을 켜 보자' },
  c_warm: { b: '인형과 함께 눈보라 피하기', s: '작은 등을 켜니, 따뜻해' },
  c_sleep: { b: '인형과 함께 눈보라 피하기', s: '작은 등을 켜니, 따뜻해' },
  c_zzz: { b: '인형과 함께 눈보라 피하기', s: '쿨쿨… 좋은 꿈 꿔' },
  c_wake: { b: '좋은 아침!', s: '옷장에서 나가 보자' },
  d_stack: { b: '아침 정리하기', s: '이불 더미를 꺼내 원래 자리에 두자' },
  d_teddy: { b: '아침 정리하기', s: '곰인형을 창가 자리에 앉혀 주자' },
  d_scarf: { b: '산책 준비', s: '옷장 문에 걸린 빨간 목도리를 두르자' },

function update(dt) {
  G.time += dt;
  const T = G.trans;
  if (T) { T.t += dt; if (!T.done && T.t >= T.dur / 2) { T.done = true; T.mid && T.mid(); } if (T.t >= T.dur) G.trans = null; }

  if (G.bubble) { G.bubble.t -= dt; if (G.bubble.t <= 0) G.bubble = null; }
  if (G.exprOv) { G.exprOv.t -= dt; if (G.exprOv.t <= 0) G.exprOv = null; }
  G.stepT += dt;
  const locked = !!G.trans || G.sitFire || G.scene === 'closet';

  // 이동
  const p = G.p;
  let vx = (K.right || PAD.right ? 1 : 0) - (K.left || PAD.left ? 1 : 0);
  let vz = (K.down || PAD.down ? 1 : 0) - (K.up || PAD.up ? 1 : 0);
  if (vx || vz) { G.target = null; G.pend = null; }
  else if (G.target) {
    const sx = G.scene === 'out' ? 1 / 7 : 1;
    const dx = (G.target.x - p.x) * sx, dz = G.target.z - p.z, d = Math.hypot(dx, dz);
    if (d < 1.2) G.target = null; else { vx = dx / d; vz = dz / d; }
  }
  const mag = Math.hypot(vx, vz);
  p.moving = !locked && mag > .01;
  const pushing = G.carry === 'stack';
  if (p.moving) {
    vx /= Math.max(1, mag); vz /= Math.max(1, mag);
    if (G.scene === 'room') {
      const sp = pushing ? 24 : 34;
      const nx = p.x + vx * sp * dt, nz = p.z + vz * sp * .85 * dt;
      if (!roomBlocked(nx, p.z)) p.x = nx;
      if (!roomBlocked(p.x, nz)) p.z = nz;
    } else {
      p.x = clamp(p.x + vx * 290 * dt, 140, WW - 90);
      p.z = clamp(p.z + vz * 42 * dt, 0, 100);
      G.stepAcc += Math.abs(vx * 290 * dt) + Math.abs(vz * 42 * dt) * 6;
      if (G.stepAcc > 46) { G.stepAcc = 0; G.foot.push({ x: p.x + (G.foot.length % 2 ? 14 : -14), z: p.z, t: G.time }); if (G.foot.length > 140) G.foot.shift(); }

    else if (Math.abs(vx) > Math.abs(vz) * .7) p.view = 'side';
    else p.view = vz < 0 ? 'back' : 'front';
    if ((G.footT = (G.footT || 0) + dt) > .3) { G.footT = 0; sfx('step'); }
  } else {
    G.idle += dt;
    if (G.idle > .9 && !pushing) p.view = 'front';
  }
  // 밀고 가는 이불 더미
  if (pushing) {
    const d = p.dir, dl = Math.hypot(d.x, d.z) || 1;
    const tx = p.x + d.x / dl * 26, tz = clamp(p.z + d.z / dl * 15, 0, 100);
    G.stackPos.x += (tx - G.stackPos.x) * Math.min(1, dt * 10);
    G.stackPos.z += (tz - G.stackPos.z) * Math.min(1, dt * 10);
  }

  // 체온/체력
  let dw = 0;
  if (G.scene === 'room') dw = G.phase === 'night' ? -.3 : (G.warm < 75 ? 2 : 0);
  else if (G.scene === 'closet') dw = G.img === 'closet_lit' || G.img === 'closet_sleep' ? 22 : (G.phase === 'closetMorning' ? 2 : -.2);
  else {
    const sun = sstep(.45, .9, G.tod);
    dw = -lerp(.55, .22, sun) * (G.scarf ? .6 : 1) * (G.carry === 'snowball' ? 1.4 : 1);
    const fd = Math.abs(p.x - 2600) + Math.abs(p.z - 40) * 4;
    if (fd < 260) dw = Math.max(dw, 10);
    if (G.sitFire) dw = 26;
  }
  if (!G.trans) G.warm = clamp(G.warm + dw * dt, 0, 100);
  if (G.warm <= 0) G.hp = Math.max(0, G.hp - 4 * dt);
  else if (G.warm > 45) G.hp = Math.min(100, G.hp + 3 * dt);
  if (G.hp <= 0 && !G.trans) {
    G.hp = 60; G.warm = 55;
    if (G.scene === 'out') transition('너무 추워서 집으로 돌아왔어…', () => { G.carry = null; G.outNight ? startNight(false) : returnHomeDay(); }, 2.6);
    else transition('너무 추워서 깜빡 잠들었어…', () => { G.warm = 55; startNight(false); }, 2.6);
  }

  // 장면별 진행
  if (G.scene === 'closet') {
    if (G.step === 'c_enter' && G.stepT > 1.3) { showImg('closet_dark', .8); setStep('c_lamp'); say(['쉿, 눈보라가', '지나갈 때까지…'], 'neutral', 3.5); }
    if (G.step === 'c_warm' && G.warm >= 99.5) { setStep('c_sleep'); say(['이제 하나도 안 추워.', '곰돌아, 잘 자…'], 'happy', 5); }
    if (G.step === 'c_zzz' && G.stepT > 2.8) transition('다음 날 아침', () => startMorning(), 3);
  }
  if (G.scene === 'out') {
    if (G.sitFire && G.warm >= 99.5) {
      G.sitFire = false; setStep('o_home'); sfx('ok');
      say(['몸이 사르르 녹았어.', '이제 집에 가자!'], 'happy', 4.5);

    }

    }

  // 상호작용 찾기
  G.acts = G.trans || (locked && G.scene !== 'closet') ? [] : (G.scene === 'room' ? roomActs() : G.scene === 'out' ? outActs() : closetActs());
  let best = null, bd = 1e9;
  for (const a of G.acts) {
    const d = G.scene === 'out' ? Math.hypot(a.x - p.x, (a.z - p.z) * 5) : Math.hypot(a.x - p.x, (a.z - p.z) * .8);
    if (d < a.r && d < bd) { bd = d; best = a; }
  }
  G.near = best;
  if (G.pend && best && best.id === G.pend) { G.pend = null; G.target = null; doAct(best); }
  if (G.pend && !G.target) G.pend = null;
  audioTick();
}

  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (G.menu) { G.menu = false; return; } PAD.act = 1; interact(); }
  if (e.code === 'Escape' || e.code === 'Tab') { e.preventDefault(); G.menu = !G.menu; sfx('ui'); }
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) K[k] = 0; if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') PAD.act = 0; });
addEventListener('blur', () => { K.up = K.down = K.left = K.right = 0; });
function cpos(e) { const r = cv.getBoundingClientRect(); return [OX + (e.clientX - r.left) / r.width * CW, OY0 + (e.clientY - r.top) / r.height * CH]; }
const near = (b, x, y) => Math.hypot(x - b[0], y - b[1]) <= b[2];
const held = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus(); audioInit();
  if (!ready) return;
  const [x, y] = cpos(e);
  if (G.menu) {
    for (const [bx, by, bw, bh, m] of MENU_R) if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { G.menu = !!m.keep; sfx('ui'); m.f(); return; }
    G.menu = false; return;
  }
  if (near(BTN.gear, x, y)) { G.menu = true; sfx('ui'); return; }
  if (near(BTN.mute, x, y)) { toggleMute(); return; }
  for (const d of ['up', 'down', 'left', 'right']) if (near(BTN[d], x, y)) { PAD[d] = 1; held.set(e.pointerId, d); G.target = null; try { cv.setPointerCapture(e.pointerId); } catch (_) { } return; }
  if (near(BTN.act, x, y)) { PAD.act = 1; held.set(e.pointerId, 'act'); interact(); return; }
  if (G.trans) return;
  // 화면 탭: 물건을 누르면 그쪽으로 걸어가서 행동, 바닥을 누르면 그 자리로 이동
  for (const a of G.acts || []) {
    const [hx, hy, hw, hh] = a.hit, ox = a.world ? OX - G.cam : 0;
    if (x >= hx + ox && x <= hx + ox + hw && y >= hy && y <= hy + hh) {
      if ((G.near && G.near.id === a.id) || G.scene === 'closet') { doAct(a); return; }
      G.target = { x: a.x, z: a.z }; G.pend = a.id; return;
    }
  }
  if (G.scene === 'room') {
    const z = clamp((y - 735) / 3.3, 0, 100), s = RS(z), xx = clamp(50 + (x - 590) / (11 * s), 0, 100);
    G.target = { x: xx, z }; G.pend = null;
  } else if (G.scene === 'out' && !G.sitFire) {
    G.target = { x: clamp(x - OX + (G.cam || 0), 140, WW - 90), z: clamp((y - 790) / 2.7, 0, 100) }; G.pend = null;
  }
});
const release = e => { const d = held.get(e.pointerId); if (d) { PAD[d] = 0; held.delete(e.pointerId); } };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   시작
   ========================================================= */
newGame();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (ready && !G.menu) update(dt);
  render();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) { document.fonts.load(`900 40px "Noto Sans KR"`).catch(() => { }); document.fonts.load(`700 24px "Noto Sans KR"`).catch(() => { }); }
loadAll().then(() => { ready = true; });
requestAnimationFrame(frame);
window.__G = G;
</script>
