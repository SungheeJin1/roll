<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원숭이 인형의 겨울</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
/* 한 화면 게임: 영상과 같은 1180×1150 비율의 캔버스를 화면 가운데에 맞춤 */
:root{
  --bg:#06070c;
  --frame:#c8c4d4;
  --ink:#f4f1f7;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#wrap{
  position:relative;
  width:min(100%, calc((100dvh - 24px) * 1180 / 1150));
  max-width:100%;
  aspect-ratio:1180/1150;
  border:3px solid var(--frame);
  border-radius:4px;
  box-sizing:border-box;
  background:#000;
}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px #f2c14e}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="원숭이 인형의 겨울 게임 화면"></canvas></div>
<script>
'use strict';
/* =========================================================
   원숭이 인형의 겨울 — 눈 오는 밤 / 아침 / 바깥 산책
   화면 크기: 1180 × 1150 (원본 영상과 동일)
   ========================================================= */
const W = 1180, H = 1150;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* 픽셀 UI: 저해상도 캔버스에 그린 뒤 확대해서 영상의 도트 느낌을 그대로 살린다 */
const UI_S = 4, TX_S = 2;
const uiC = mk(Math.ceil(W / UI_S), Math.ceil(H / UI_S)), u = uiC.getContext('2d');
const txC = mk(W / TX_S, Math.ceil(H / TX_S)), t2 = txC.getContext('2d');
const dyn = mk(W, H), dg = dyn.getContext('2d');
const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const HX = new Map();
function hex(h) { let v = HX.get(h); if (!v) { const s = h.slice(1); v = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; HX.set(h, v); } return v; }
function mixc(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, Math.PI * 2); }
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
let seed = 11;
function srand(s) { seed = s; }
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

/* =========================================================
   캐릭터: 주황 털 원숭이 인형 (머리띠, 하얀 얼굴, 큰 눈)
   ========================================================= */
const FUR = { base: '#d8963a', light: '#f4c672', dark: '#a6611f', inner: '#f7d59c' };
const FZ = []; srand(5); for (let i = 0; i < 120; i++) FZ.push([rnd(), rnd(), rnd()]);
function furGrad(g, cx, cy, r) {
  const gr = g.createRadialGradient(cx - r * .32, cy - r * .42, r * .08, cx, cy, r * 1.08);
  gr.addColorStop(0, FUR.light); gr.addColorStop(.55, FUR.base); gr.addColorStop(1, FUR.dark); return gr;
}
function fuzz(g, cx, cy, rx, ry, col, n, len, w) {
  g.strokeStyle = col; g.lineWidth = w || 5; g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) {
    const f = FZ[i % FZ.length], a = Math.PI * 2 * ((i + f[0] * .7) / n), ca = Math.cos(a), sa = Math.sin(a);
    const x0 = cx + ca * rx * .93, y0 = cy + sa * ry * .93, L = len * (.5 + f[1] * .9);
    g.moveTo(x0, y0); g.lineTo(x0 + ca * L + (f[2] - .5) * 7, y0 + sa * L + (f[2] - .5) * 7);
  }
  g.stroke();
}
function drawTail(g, t, side) {
  g.save(); g.scale(side, 1);
  const w = Math.sin(t * 2.1) * 7;
  g.lineCap = 'round';
  g.strokeStyle = FUR.dark; g.lineWidth = 20;
  g.beginPath(); g.moveTo(28, -34); g.bezierCurveTo(92, -8, 128 + w, -42, 114 + w, -86); g.bezierCurveTo(106 + w, -108, 82 + w, -102, 88 + w, -84); g.stroke();
  g.strokeStyle = FUR.base; g.lineWidth = 14; g.stroke();
  g.restore();
}
function drawBand(g, fx, back) {
  /* 헤어롤: 앞머리가 분홍 헤어롤에 돌돌 말려 있고, 양옆으로 분홍 롤 끝이 살짝 보인다 */
  g.save(); g.translate(back ? 0 : fx * 30, back ? -306 : -300);
  g.lineCap = 'round';
  // 이마에서 롤로 올라가는 앞머리 결
  if (!back) {
    const bg = g.createLinearGradient(0, -10, 0, 48);
    bg.addColorStop(0, '#e9a94e'); bg.addColorStop(1, 'rgba(216,150,58,0)');
    g.fillStyle = bg; g.beginPath(); g.moveTo(-50, 14); g.quadraticCurveTo(0, 6, 50, 14);
    g.quadraticCurveTo(30, 52, 0, 50); g.quadraticCurveTo(-30, 52, -50, 14); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(160,92,30,.45)'; g.lineWidth = 3; g.beginPath();
    for (let i = -36; i <= 36; i += 12) { g.moveTo(i * .8, 46); g.quadraticCurveTo(i * .95, 30, i, 18); }
    g.stroke();
  }
  // 분홍 헤어롤 양 끝
  const end = (side) => {
    const x0 = side * 60;
    const pg = g.createLinearGradient(0, -26, 0, 26);
    pg.addColorStop(0, '#ffc6d6'); pg.addColorStop(.5, '#f497b3'); pg.addColorStop(1, '#d9708f');
    rr(g, side > 0 ? x0 - 4 : x0 - 20, -25, 24, 50, 9); g.fillStyle = pg; g.fill();
    g.strokeStyle = 'rgba(170,70,100,.45)'; g.lineWidth = 2; g.beginPath();
    for (let yy = -16; yy <= 16; yy += 10) { g.moveTo(x0 - 3, yy); g.lineTo(x0 + 3, yy); }
    g.stroke();
    ell(g, x0 + side * 18, 0, 7, 24); g.fillStyle = '#f7a9c0'; g.fill();
    ell(g, x0 + side * 18, 0, 3.5, 13); g.fillStyle = '#c45d7d'; g.fill();
  };
  end(-1); end(1);
  // 롤에 말린 앞머리 (털)
  const fg = g.createLinearGradient(0, -30, 0, 30);
  fg.addColorStop(0, '#fcd894'); fg.addColorStop(.55, '#eba951'); fg.addColorStop(1, '#c98432');
  rr(g, -62, -29, 124, 58, 27); g.fillStyle = fg; g.fill();
  g.strokeStyle = 'rgba(150,85,25,.35)'; g.lineWidth = 3; g.stroke();
  // 감긴 결 (사선 곡선)
  g.strokeStyle = 'rgba(140,78,22,.38)'; g.lineWidth = 3; g.beginPath();
  for (let i = -48; i <= 48; i += 13) { g.moveTo(i - 6, -24); g.quadraticCurveTo(i + 8, 0, i - 4, 24); }
  g.stroke();
  g.strokeStyle = 'rgba(255,238,200,.6)'; g.lineWidth = 3; g.beginPath();
  for (let i = -44; i <= 44; i += 13) { g.moveTo(i - 3, -20); g.quadraticCurveTo(i + 4, -12, i + 2, -4); }
  g.stroke();
  // 털끝이 보송하게
  g.fillStyle = '#eba951';
  for (let i = -54; i <= 54; i += 12) { ell(g, i, -27, 6, 4); g.fill(); }
  g.restore();
}
function drawEye(g, x, y, side, expr, t) {
  g.lineCap = 'round';
  if (expr === 'sleep') {
    g.strokeStyle = '#2a2230'; g.lineWidth = 6;
    g.beginPath(); g.arc(x, y - 14, 22, .18 * Math.PI, .82 * Math.PI); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.moveTo(x + side * 20, y - 2); g.lineTo(x + side * 28, y + 4); g.stroke();
    return;
  }
  if (expr === 'joy') {
    g.strokeStyle = '#2a2230'; g.lineWidth = 7;
    g.beginPath(); g.arc(x, y + 10, 21, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
    return;
  }
  const blink = ((t + side * .02) % 4.3) < .12;
  if (blink) { g.strokeStyle = '#2a2230'; g.lineWidth = 6; g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 20, y); g.stroke(); return; }
  const ry = expr === 'cry' ? 27 : 31;
  ell(g, x, y, 25, ry); g.fillStyle = '#1a1524'; g.fill();
  const ig = g.createLinearGradient(0, y - ry, 0, y + ry); ig.addColorStop(0, 'rgba(40,40,80,0)'); ig.addColorStop(1, 'rgba(90,100,170,.85)');
  ell(g, x, y + 6, 20, ry - 8); g.fillStyle = ig; g.fill();
  g.fillStyle = '#fff'; ell(g, x - 8, y - 12, 9, 10); g.fill(); ell(g, x + 9, y + 11, 4.5, 4.5); g.fill();
  if (expr === 'cry' || expr === 'worry') {
    // 처진 눈썹
    g.strokeStyle = '#3a2a2a'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(x - side * 14, y - 50); g.lineTo(x + side * 20, y - 40); g.stroke();
    // 위 눈꺼풀
    g.fillStyle = '#f6ece3'; g.beginPath(); g.moveTo(x - 28, y - ry - 4); g.lineTo(x + 28, y - ry - 4);
    g.lineTo(x + side * 28, y - ry + 9); g.lineTo(x - side * 28, y - ry + 1); g.closePath(); g.fill();
  }
  if (expr === 'cry') {
    const d = (t * 34 + (side > 0 ? 17 : 0)) % 40;
    g.fillStyle = '#76c0ff';
    const tx = x + side * 15, ty = y + 22 + d * .6;
    g.beginPath(); g.moveTo(tx, ty - 9); g.quadraticCurveTo(tx + 8, ty + 2, tx, ty + 7); g.quadraticCurveTo(tx - 8, ty + 2, tx, ty - 9); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)'; ell(g, tx - 2, ty, 2, 3); g.fill();
  }
}
function drawFace(g, fx, expr, t) {
  g.save(); g.translate(fx * 34, 0); g.scale(1 - Math.abs(fx) * .22, 1);
  g.beginPath(); g.moveTo(0, -250);
  g.bezierCurveTo(-30, -276, -94, -262, -105, -214);
  g.bezierCurveTo(-117, -160, -70, -110, 0, -106);
  g.bezierCurveTo(70, -110, 117, -160, 105, -214);
  g.bezierCurveTo(94, -262, 30, -276, 0, -250); g.closePath();
  const mg = g.createRadialGradient(-10, -195, 15, 0, -182, 118);
  mg.addColorStop(0, '#fffbf7'); mg.addColorStop(.7, '#f7ece3'); mg.addColorStop(1, '#dcc4b2');
  g.fillStyle = mg; g.fill();
  g.fillStyle = 'rgba(240,135,150,.28)'; ell(g, -72, -156, 20, 11); g.fill(); ell(g, 72, -156, 20, 11); g.fill();
  drawEye(g, -42, -186, -1, expr, t); drawEye(g, 42, -186, 1, expr, t);
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (expr === 'cry') {
    ell(g, 0, -138, 15, 11); g.fillStyle = '#6b2c33'; g.fill(); ell(g, 0, -133, 8, 4); g.fillStyle = '#e88b92'; g.fill();
  } else if (expr === 'worry') {
    g.strokeStyle = '#5a3434'; g.lineWidth = 4; g.beginPath(); g.moveTo(-12, -136); g.quadraticCurveTo(-6, -142, 0, -137); g.quadraticCurveTo(6, -142, 12, -136); g.stroke();
  } else if (expr === 'happy' || expr === 'joy') {
    g.beginPath(); g.moveTo(-14, -142); g.quadraticCurveTo(0, -120, 14, -142); g.closePath(); g.fillStyle = '#7a3038'; g.fill();
    ell(g, 0, -131, 6, 3); g.fillStyle = '#ef9aa0'; g.fill();
  } else {
    g.strokeStyle = '#5a3434'; g.lineWidth = 4; g.beginPath(); g.moveTo(-13, -140); g.quadraticCurveTo(-7, -132, 0, -139); g.quadraticCurveTo(7, -132, 13, -140); g.stroke();
  }
  g.restore();
}
function drawScarfOn(g, fx) {
  g.save(); g.translate(fx * 18, 0);
  rr(g, -70, -122, 140, 34, 16); g.fillStyle = '#d8434b'; g.fill();
  g.fillStyle = '#f6efe8'; for (let i = -54; i < 60; i += 28) g.fillRect(i, -122, 9, 34);
  rr(g, 22, -102, 30, 70, 10); g.fillStyle = '#c93a43'; g.fill();
  g.fillStyle = '#f6efe8'; g.fillRect(22, -60, 30, 8);
  g.restore();
}
/* o: {t, face(-1..1), back, moving, walk, shiver, expr, pose, sit, scarf, carry(fn)} */
function drawMonkey(g, x, y, s, o) {
  const t = o.t || 0, back = !!o.back, fx = back ? 0 : (o.face || 0);
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(5,8,20,.35)'; ell(g, 0, 0, 104, 24); g.fill();
  let bob = o.moving ? -Math.abs(Math.sin(o.walk)) * 12 : Math.sin(t * 2.2) * 2;
  if (o.sit) bob = Math.sin(t * 1.4) * 1.5;
  g.translate(o.shiver ? Math.sin(t * 55) * 2.6 : 0, bob);
  if (o.moving) g.rotate(Math.sin(o.walk) * .045);
  const pose = o.pose || 'idle';
  if (!back) drawTail(g, t, fx < -.2 ? -1 : 1);
  // 발
  g.fillStyle = furGrad(g, 0, -20, 40);
  if (o.sit) { ell(g, -44, -14, 34, 22); g.fill(); ell(g, 44, -14, 34, 22); g.fill(); g.fillStyle = FUR.inner; ell(g, -46, -10, 16, 12); g.fill(); ell(g, 46, -10, 16, 12); g.fill(); }
  else {
    const lf = o.moving ? Math.sin(o.walk) * 9 : 0;
    ell(g, -30 + fx * 10, -12 - Math.max(0, lf), 31, 17); g.fill();
    ell(g, 30 + fx * 10, -12 - Math.max(0, -lf), 31, 17); g.fill();
  }
  // 몸통
  g.fillStyle = furGrad(g, 0, -74, 66); ell(g, 0, -74, 64, o.sit ? 56 : 62); g.fill();
  fuzz(g, 0, -74, 64, 62, 'rgba(216,150,58,.8)', 40, 4, 6);
  if (!back) { const bg = g.createRadialGradient(fx * 14 - 8, -72, 4, fx * 14, -62, 40); bg.addColorStop(0, '#fffaf4'); bg.addColorStop(1, '#ead9c9'); g.fillStyle = bg; ell(g, fx * 14, -62, 34, 33); g.fill(); }
  // 팔
  const arm = (ax, ay, rx, ry, rot) => { g.fillStyle = furGrad(g, ax, ay, ry); ell(g, ax, ay, rx, ry, rot); g.fill(); };
  if (pose === 'cry' && !back) { arm(-17 + fx * 12, -100, 24, 31, .25); arm(17 + fx * 12, -100, 24, 31, -.25); g.fillStyle = FUR.inner; ell(g, -14 + fx * 12, -84, 12, 9); g.fill(); ell(g, 14 + fx * 12, -84, 12, 9); g.fill(); }
  else if (pose === 'sleep' || o.sit) { arm(-52, -58, 21, 30, .9); arm(52, -58, 21, 30, -.9); }
  else if (pose !== 'carry') {
    const sw = o.moving ? Math.sin(o.walk) * .35 : Math.sin(t * 2) * .05;
    arm(-62 + fx * 6, -80, 21, 34, .35 + sw); arm(62 + fx * 6, -80, 21, 34, -.35 + sw);
  }
  if (o.scarf) drawScarfOn(g, fx);
  // 귀
  const ear = (ex, sc) => { g.fillStyle = furGrad(g, ex, -205, 46); ell(g, ex, -205, 42 * sc, 47 * sc); g.fill(); if (!back) { g.fillStyle = FUR.inner; ell(g, ex, -203, 23 * sc, 28 * sc); g.fill(); } };
  ear(-128 + fx * 18, 1 + fx * .12); ear(128 + fx * 18, 1 - fx * .12);
  // 머리
  g.fillStyle = furGrad(g, 0, -216, 126); ell(g, 0, -216, 128, 118); g.fill();
  fuzz(g, 0, -216, 128, 118, 'rgba(200,132,50,.85)', 90, 5, 7);
  fuzz(g, 0, -216, 122, 112, 'rgba(255,215,140,.35)', 50, 4, 4);
  if (!back) drawFace(g, fx, o.expr || 'normal', t);
  else { g.fillStyle = 'rgba(120,60,15,.25)'; ell(g, 0, -150, 70, 20); g.fill(); }
  drawBand(g, fx, back);
  if (back) drawTail(g, t, 1);
  if (pose === 'carry') {
    arm(-84, -300, 20, 36, -.75); arm(84, -300, 20, 36, .75);
    if (o.carry) { g.save(); g.translate(0, -352); o.carry(g); g.restore(); }
  }
  g.restore();
}

/* ---------- 소품 ---------- */
function drawTeddy(g, x, y, s, warm) {
  const c1 = warm ? '#5c4a47' : '#4a4248', c2 = warm ? '#7a6560' : '#655c63', c3 = warm ? '#a48b80' : '#837a7f';
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,.3)'; ell(g, 0, 0, 74, 14); g.fill();
  const body = g.createRadialGradient(-15, -80, 5, 0, -60, 70); body.addColorStop(0, c2); body.addColorStop(1, c1);
  g.fillStyle = c1; ell(g, -40, -20, 28, 23); g.fill(); ell(g, 40, -20, 28, 23); g.fill();
  g.fillStyle = c3; ell(g, -42, -18, 13, 13); g.fill(); ell(g, 42, -18, 13, 13); g.fill();
  g.fillStyle = body; ell(g, 0, -62, 52, 54); g.fill();
  g.fillStyle = c3; ell(g, 0, -55, 28, 30); g.fill();
  g.fillStyle = c1; ell(g, -52, -74, 18, 31, .45); g.fill(); ell(g, 52, -74, 18, 31, -.45); g.fill();
  g.fillStyle = c1; ell(g, -42, -166, 21, 21); g.fill(); ell(g, 42, -166, 21, 21); g.fill();
  g.fillStyle = c3; ell(g, -42, -165, 10, 10); g.fill(); ell(g, 42, -165, 10, 10); g.fill();
  const hg = g.createRadialGradient(-15, -150, 5, 0, -134, 60); hg.addColorStop(0, c2); hg.addColorStop(1, c1);
  g.fillStyle = hg; ell(g, 0, -134, 56, 49); g.fill();
  g.fillStyle = c3; ell(g, 0, -120, 23, 17); g.fill();
  g.fillStyle = '#17121a'; ell(g, 0, -127, 9, 6); g.fill(); ell(g, -21, -143, 5.5, 6.5); g.fill(); ell(g, 21, -143, 5.5, 6.5); g.fill();
  g.strokeStyle = '#17121a'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, -121); g.lineTo(0, -113); g.moveTo(-7, -110); g.quadraticCurveTo(0, -106, 7, -110); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.7)'; ell(g, -23, -145, 2, 2); g.fill(); ell(g, 19, -145, 2, 2); g.fill();
  g.restore();
}
function drawFolded(g, x, y, w, h, col, sh) {
  const gr = g.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, col); gr.addColorStop(1, sh);
  rr(g, x - w / 2, y - h, w, h, h * .48); g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.13)'; g.lineWidth = 2.5; g.beginPath();
  g.moveTo(x - w / 2 + h * .4, y - h * .5); g.quadraticCurveTo(x, y - h * .38, x + w / 2 - h * .4, y - h * .52); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(x - w / 2 + h * .5, y - h + 5); g.lineTo(x + w / 2 - h * .5, y - h + 5); g.stroke();
}
function drawPillow(g, x, y, w, h, col, sh) {
  const l = x - w / 2, r = x + w / 2, tp = y - h;
  const gr = g.createLinearGradient(0, tp, 0, y); gr.addColorStop(0, col); gr.addColorStop(1, sh);

function update(dt) {
  G.time += dt;
  const T = G.trans;
  if (T) {
    T.t += dt;
    if (!T.done && T.t >= T.dur / 2) { T.done = true; T.mid && T.mid(); }
    if (T.t >= T.dur) G.trans = null;
  }
  G.tod += clamp(G.todTarget - G.tod, -dt * .06, dt * .06);
  if (G.bubble) { G.bubble.t -= dt; if (G.bubble.t <= 0) G.bubble = null; }
  if (G.exprOv) { G.exprOv.t -= dt; if (G.exprOv.t <= 0) G.exprOv = null; }
  G.stepT += dt;
  const locked = !!G.trans || G.sitFire || G.scene === 'closet';

  // 이동
  const p = G.p;
  let vx = (K.right || PAD.right ? 1 : 0) - (K.left || PAD.left ? 1 : 0);
  let vz = (K.down || PAD.down ? 1 : 0) - (K.up || PAD.up ? 1 : 0);
  if (vx || vz) { G.target = null; G.pend = null; }
  else if (G.target) {
    const sx = G.scene === 'out' ? 1 / 7 : 1;
    const dx = (G.target.x - p.x) * sx, dz = G.target.z - p.z, d = Math.hypot(dx, dz);
    if (d < 1.2) G.target = null; else { vx = dx / d; vz = dz / d; }
  }
  const mag = Math.hypot(vx, vz);
  p.moving = !locked && mag > .01;
  if (p.moving) {
    vx /= Math.max(1, mag); vz /= Math.max(1, mag);
    if (G.scene === 'room') {
      const sp = G.carry ? 30 : 36;
      const nx = p.x + vx * sp * dt, nz = p.z + vz * sp * .85 * dt;
      if (!roomBlocked(nx, p.z)) p.x = nx;
      if (!roomBlocked(p.x, nz)) p.z = nz;
    } else {
      p.x = clamp(p.x + vx * 290 * dt, 140, WW - 90);
      p.z = clamp(p.z + vz * 42 * dt, 0, 100);
      G.stepAcc += Math.abs(vx * 290 * dt) + Math.abs(vz * 42 * dt) * 6;
      if (G.stepAcc > 46) { G.stepAcc = 0; G.foot.push({ x: p.x + (G.foot.length % 2 ? 14 : -14), z: p.z, t: G.time }); if (G.foot.length > 140) G.foot.shift(); }
    }
    p.walk += dt * 11;
    G.idle = 0;
    if (Math.abs(vx) > Math.abs(vz) * .7) { p.faceT = Math.sign(vx) * .85; p.back = false; }
    else if (vz < 0) { p.back = true; p.faceT = vx * .5; }
    else { p.back = false; p.faceT = vx * .5; }
    if ((G.footT = (G.footT || 0) + dt) > .3) { G.footT = 0; sfx('step'); }
  } else {
    G.idle += dt;
    if (G.idle > .9) { p.back = false; p.faceT = 0; }
  }
  p.face += (p.faceT - p.face) * Math.min(1, dt * 8);

  // 체온/체력
  let dw = 0;
  if (G.scene === 'room') dw = G.phase === 'night' ? -.42 : (G.warm < 75 ? 2 : 0);
  else if (G.scene === 'closet') dw = G.lamp ? 22 : (G.phase === 'closetMorning' ? 2 : -.2);
  else {
    const sun = sstep(.45, .9, G.tod);
    dw = -lerp(.55, .22, sun) * (G.scarf ? .6 : 1) * (G.carry === 'snowball' ? 1.4 : 1);
    const fd = Math.abs(p.x - 2600) + Math.abs(p.z - 40) * 4;
    if (fd < 260) dw = Math.max(dw, 10);
    if (G.sitFire) dw = 26;
  }
  if (!G.trans) G.warm = clamp(G.warm + dw * dt, 0, 100);
  if (G.warm <= 0) G.hp = Math.max(0, G.hp - 4 * dt);
  else if (G.warm > 45) G.hp = Math.min(100, G.hp + 3 * dt);
  if (G.hp <= 0 && !G.trans) {
    G.hp = 60; G.warm = 55;
    if (G.scene === 'out') transition('너무 추워서 집으로 돌아왔어…', () => { G.carry = null; G.outNight ? startNight(false) : returnHomeDay(); }, 2.6);
    else transition('너무 추워서 깜빡 잠들었어…', () => { G.warm = 55; startNight(false); }, 2.6);
  }

  // 장면별 진행
  if (G.scene === 'closet') {
    G.doorT = Math.min(1, G.doorT + dt * (G.stepT > 1 ? .9 : 0));
    if (G.step === 'c_warm' && G.warm >= 99.5) { setStep('c_sleep'); say(['이제 하나도 안 추워.', '곰돌아, 잘 자…'], 'happy', 5); }
    if (G.step === 'c_zzz' && G.stepT > 2.6) transition('다음 날 아침', () => startMorning(), 3);
  }
  if (G.scene === 'out') {
    if (G.sitFire && G.warm >= 99.5) {
      G.sitFire = false; setStep('o_home'); sfx('ok');
      say(['몸이 사르르 녹았어.', '이제 집에 가자!'], 'joy', 4.5);
      if (!G.outNight) G.todTarget = .1;
    }

  if (G.pend && !G.target) G.pend = null;
  audioTick();
}

  else if (n === 'ok') [523, 659, 784, 1046].forEach((f, i) => tone(f, .28, 'triangle', .1, i * .08));
  else if (n === 'ui') tone(880, .06, 'square', .04);
  else if (n === 'bird') { tone(2200, .07, 'sine', .07); tone(2600, .07, 'sine', .07, .09); tone(2400, .07, 'sine', .06, .2); }
}
const MEL = [659, 784, 880, 784, 659, 587, 523, 0, 587, 659, 523, 440, 523, 0, 0, 0];
function audioTick() {
  const a = AU.ctx; if (!a) return;
  const wind = G.scene === 'out' ? lerp(.16, .05, G.tod) : G.scene === 'room' ? (G.phase === 'night' ? .06 : .015) : .02;
  AU.windGain.gain.setTargetAtTime(G.muted ? 0 : wind, a.currentTime, .4);
  if (G.muted) return;
  while (AU.next < a.currentTime + .4) {
    if (AU.next < a.currentTime) AU.next = a.currentTime + .05;
    const f = MEL[AU.i++ % MEL.length];
    if (f) { const d = AU.next - a.currentTime; tone(f * (G.tod > .5 ? 1 : .5), .9, 'sine', .03, d); tone(f * 2 * (G.tod > .5 ? 1 : .5), .4, 'sine', .01, d); }
    AU.next += .45;
  }
}
function toggleMute() {
  audioInit(); G.muted = !G.muted;
  if (AU.master) AU.master.gain.setTargetAtTime(G.muted ? 0 : .6, AU.ctx.currentTime, .05);
  if (!G.muted) sfx('ok');
}

/* =========================================================
   입력
   ========================================================= */
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { K[k] = 1; e.preventDefault(); audioInit(); return; }
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (G.menu) { G.menu = false; return; } PAD.act = 1; interact(); }
  if (e.code === 'Escape' || e.code === 'Tab') { e.preventDefault(); G.menu = !G.menu; sfx('ui'); }
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) K[k] = 0; if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') PAD.act = 0; });
addEventListener('blur', () => { K.up = K.down = K.left = K.right = 0; });
function cpos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const near = (b, x, y) => Math.hypot(x - b[0], y - b[1]) <= b[2];
const held = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus(); audioInit();
  const [x, y] = cpos(e);
  if (G.menu) {
    for (const [bx, by, bw, bh, m] of MENU_R) if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { G.menu = false; sfx('ui'); m.f(); if (m.t === MENU[5].t) G.menu = true; return; }
    G.menu = false; return;
  }
  if (near(BTN.gear, x, y)) { G.menu = true; sfx('ui'); return; }
  if (near(BTN.mute, x, y)) { toggleMute(); return; }
  for (const d of ['up', 'down', 'left', 'right']) if (near(BTN[d], x, y)) { PAD[d] = 1; held.set(e.pointerId, d); G.target = null; cv.setPointerCapture(e.pointerId); return; }
  if (near(BTN.act, x, y)) { PAD.act = 1; held.set(e.pointerId, 'act'); interact(); return; }
  if (G.trans) return;
  // 화면 탭: 물건을 누르면 그쪽으로 걸어가서 행동, 바닥을 누르면 그 자리로 이동
  for (const a of G.acts || []) {
    const [hx, hy, hw, hh] = a.hit; const ox = a.world ? -G.cam : 0;
    if (x >= hx + ox && x <= hx + ox + hw && y >= hy && y <= hy + hh) {
      if (G.near && G.near.id === a.id) { doAct(a); return; }
      if (G.scene === 'closet') { doAct(a); return; }
      G.target = { x: a.x, z: a.z }; G.pend = a.id; return;
    }
  }
  if (G.scene === 'room') {
    const z = clamp((y - 740) / 3.3, 0, 100), s = RS(z), xx = clamp(50 + (x - 590) / (11 * s), 0, 100);
    G.target = { x: xx, z }; G.pend = null;
  } else if (G.scene === 'out' && !G.sitFire) {
    G.target = { x: clamp(x + (G.cam || 0), 140, WW - 90), z: clamp((y - 790) / 2.7, 0, 100) }; G.pend = null;
  }
});
const release = e => { const d = held.get(e.pointerId); if (d) { PAD[d] = 0; held.delete(e.pointerId); } };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   시작
   ========================================================= */
newGame();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!G.menu) update(dt);
  render();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) { document.fonts.load(`900 40px "Noto Sans KR"`).catch(() => { }); document.fonts.load(`700 24px "Noto Sans KR"`).catch(() => { }); }
requestAnimationFrame(frame);
window.__G = G;
</script>
